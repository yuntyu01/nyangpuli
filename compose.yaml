services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: nyangpuli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
      POSTGRES_DB: nyangpuli
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyangpuli -d nyangpuli"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: .
    environment:
      NYANG_ENV: development
      NYANG_API_TOKEN: ${NYANG_API_TOKEN:?Set a random local API token}
      NYANG_USER_ID: ${NYANG_USER_ID:-local-demo}
      NYANG_MEMORY_PATH: /data/memory.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres-data:
  api-data:
